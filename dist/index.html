<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PromptGuard AI</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f0f4f2;color:#152820;font:16px/1.55 system-ui,sans-serif}main{max-width:1130px;margin:auto;padding:40px 24px}header{background:#142e25;color:#f2fff7;padding:32px;border-radius:16px}h1{margin:0;font-size:clamp(2rem,6vw,3.6rem);letter-spacing:-.06em}h2,h3,p{margin:0 0 12px}section,article{background:white;border:1px solid #d3e0d9;border-radius:12px;padding:20px;margin-top:16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}button{font:inherit;font-weight:650;border:1px solid #285b47;border-radius:8px;background:#285b47;color:white;padding:9px 14px;cursor:pointer}button+button{background:white;color:#193f30}label{display:block;font-weight:650}textarea,select{display:block;width:100%;font:inherit;color:inherit;background:#f8faf9;border:1px solid #8da69a;border-radius:7px;padding:8px;margin:6px 0 12px}textarea{min-height:90px;resize:vertical}small{display:block;color:#405c50}output{display:block;font-weight:650;overflow-wrap:anywhere}.metric{padding:12px;background:#eaf3ee;border-radius:8px}@media(max-width:650px){.grid{grid-template-columns:1fr}}
</style>
<main>
<header><h1>PromptGuard AI</h1><p>Compare defensive prompt revisions on the same cases.</p></header>
<section aria-labelledby="setup"><h2 id="setup">Experiment setup</h2>
<p id="source" role="status"></p>
<div class="grid" id="prompts"></div>
<div class="toolbar"><button id="demo">Load synthetic fixtures</button><button id="manual">Start manual experiment</button><button id="export">Export evidence</button></div></section>
<section aria-labelledby="metrics"><h2 id="metrics">Before and after</h2><div class="grid" id="summary"></div>
<small>Confirmed failures and benign successes use classified cases as their denominators. Leakage and inconclusive rates use all applicable cases.</small></section>
<div id="cases"></div>
</main>
<script type="module" src="app.js"></script>
</html>
